name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub release on tags

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Release-signing secrets. These MUST be job-level: a step's `if` is evaluated
      # before that step's own step-level env is applied, so a step can never see
      # its own step-level variables in its `if` (the decode step would be skipped forever).
      KEYSTORE_BASE64: ${{ secrets.BUDDY_KEYSTORE_BASE64 }}
      KEYSTORE_ALIAS: ${{ secrets.BUDDY_KEYSTORE_ALIAS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Release signing is optional: set the BUDDY_KEYSTORE_BASE64 (+ _PASSWORD, + _ALIAS)
      # repository secrets to get a signed APK; otherwise the APK is unsigned.
      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BUDDY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_ALIAS" ]; then echo "BUDDY_KEY_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"; fi

      - name: Build release APK (GitHub) and bundle (Google Play)
        env:
          BUDDY_KEYSTORE_PASSWORD: ${{ secrets.BUDDY_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleGithubRelease bundlePlayRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)
          cp "$apk" "dist/mrai-buddy-${GITHUB_REF_NAME//\//-}.apk"
          # fixed name too, so releases/latest/download/mrai-buddy.apk always gets the newest version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then cp "$apk" dist/mrai-buddy.apk; fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: mrai-buddy-apk
          path: dist/*.apk

      # The Play bundle is uploaded to the Play Console by hand; it's never attached to the GitHub release.
      - uses: actions/upload-artifact@v7
        with:
          name: buddy-play-aab
          path: app/build/outputs/bundle/playRelease/*.aab

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # a release made by hand first (with its own notes) just gets the CI-built APKs attached
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Mrai Buddy $GITHUB_REF_NAME" --generate-notes
          fi
